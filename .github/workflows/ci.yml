name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos (TypeScript strict)
        run: npm run typecheck
      - name: Testes unitários (Vitest)
        run: npm test
      - name: Build de produção
        run: npm run build
